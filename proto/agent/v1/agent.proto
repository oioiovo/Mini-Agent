syntax = "proto3";

package agent.v1;

option java_multiple_files = true;

// AgentService is the public surface for thin multi-language clients.
service AgentService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc RunAgent(RunAgentRequest) returns (stream AgentEvent);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc ResolveToolApproval(ResolveToolApprovalRequest) returns (ResolveToolApprovalResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc RegisterHttpTool(RegisterHttpToolRequest) returns (RegisterHttpToolResponse);
  rpc UpsertMcpServer(UpsertMcpServerRequest) returns (UpsertMcpServerResponse);
}

message CreateSessionRequest {
  map<string, string> metadata = 1;
  string system_prompt = 2;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message Session {
  string id = 1;
  int64 created_at_ms = 2;
  int64 updated_at_ms = 3;
  map<string, string> metadata = 4;
  string system_prompt = 5;
  int32 message_count = 6;
}

message RunAgentRequest {
  string session_id = 1;
  string message = 2;
  // Optional override; empty uses server default.
  string model = 3;
  int32 max_steps = 4;
  int32 timeout_ms = 5;
}

message CancelRunRequest {
  string run_id = 1;
}

message CancelRunResponse {
  bool cancelled = 1;
}

message ResolveToolApprovalRequest {
  string run_id = 1;
  string approval_id = 2;
  // approve | deny
  string decision = 3;
  string note = 4;
}

message ResolveToolApprovalResponse {
  bool ok = 1;
  // approved | denied | not_found | invalid
  string status = 2;
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string description = 2;
  // JSON Schema object encoded as JSON string.
  string input_schema_json = 3;
  string source = 4; // local | http | mcp
  bool side_effect = 5;
  bool requires_approval = 6;
  // read | write | network | exec
  string risk = 7;
}

message RegisterHttpToolRequest {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  string url = 4;
  map<string, string> headers = 5;
  bool side_effect = 6;
  bool requires_approval = 7;
}

message RegisterHttpToolResponse {
  ToolInfo tool = 1;
}

message UpsertMcpServerRequest {
  string name = 1;
  // stdio | sse | http
  string transport = 2;
  // For stdio: command. For sse/http: URL.
  string endpoint = 3;
  repeated string args = 4;
  map<string, string> env = 5;
}

message UpsertMcpServerResponse {
  string name = 1;
  int32 tool_count = 2;
}

message AgentEvent {
  string run_id = 1;
  string session_id = 2;
  int64 timestamp_ms = 3;
  oneof payload {
    RunStartedEvent run_started = 10;
    TextDeltaEvent text_delta = 11;
    ToolCallEvent tool_call = 12;
    ToolResultEvent tool_result = 13;
    MemoryHitEvent memory_hit = 14;
    RunCompletedEvent run_completed = 15;
    RunErrorEvent run_error = 16;
    ToolApprovalRequiredEvent tool_approval_required = 17;
    ToolResultDeltaEvent tool_result_delta = 18;
    SubagentStartedEvent subagent_started = 19;
    SubagentProgressEvent subagent_progress = 20;
    SubagentCompletedEvent subagent_completed = 21;
  }
}

message RunStartedEvent {
  string model = 1;
}

message TextDeltaEvent {
  string text = 1;
}

message ToolCallEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
}

message ToolResultEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  string result_json = 3;
  bool is_error = 4;
}

message ToolResultDeltaEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  string chunk = 3;
  int32 sequence = 4;
}

message ToolApprovalRequiredEvent {
  string approval_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string arguments_json = 4;
  // read | write | network | exec
  string risk = 5;
  string reason = 6;
}

message MemoryHitEvent {
  string memory_id = 1;
  string content = 2;
  double score = 3;
}

message RunCompletedEvent {
  string final_text = 1;
  int32 steps = 2;
}

message RunErrorEvent {
  string code = 1;
  string message = 2;
}

message SubagentStartedEvent {
  string subagent_id = 1;
  string child_run_id = 2;
  string child_session_id = 3;
  string prompt = 4;
}

message SubagentProgressEvent {
  string subagent_id = 1;
  string child_run_id = 2;
  // text_delta | tool_call | tool_result | tool_result_delta | error
  string kind = 3;
  string text = 4;
  string tool_name = 5;
  string payload_json = 6;
}

message SubagentCompletedEvent {
  string subagent_id = 1;
  string child_run_id = 2;
  string final_text = 3;
  bool is_error = 4;
}
