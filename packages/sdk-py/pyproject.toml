[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-agent"
version = "0.1.0"
description = "Thin Python client for Mini-Agent runtime (Connect over HTTP)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mini-Agent" }]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel.sources]
"src/mini_agent" = "mini_agent"

[tool.hatch.build.targets.sdist]
include = ["src/mini_agent", "README.md", "pyproject.toml"]
